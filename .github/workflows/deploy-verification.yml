name: Deploy Verification

# Runs the 8-check post-deploy verifier against the live Vercel URL.
# Triggers:
#   • workflow_run           — after "CI/CD — Test & Deploy" finishes a push to
#                              main successfully, i.e. after its deploy-production
#                              job has run `vercel --prod`. This used to be
#                              `on: push`, which raced CI: UAT + Playwright take
#                              6-15 min before the deploy even starts, so the
#                              ~5 min verify window saw the previous version and
#                              filed a false FAIL on nearly every ship
#                              (v8.187.0-v8.188.2, issues #519-#522).
#                              CI failing (tests or deploy) skips this run; CI's
#                              own red status is the alarm for that.
#   • cron 03:00 UTC nightly — catches CDN drift and intermittent issues
#   • manual workflow_dispatch — for ad-hoc re-runs from the Actions tab
#
# On FAIL: opens an issue with labels `deploy-verification`, `bug`, `priority: high`.
# On WARN: workflow stays green but report is in the run summary.
# On PASS: silent (no inbox spam).

on:
  workflow_run:
    # Must match the `name:` in ci.yml exactly.
    workflows: ['CI/CD — Test & Deploy']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Back-to-back ships: only the newest verification matters, because prod
# serves whichever deploy finished last. Cancel the older run instead of
# letting it compare its own version against the newer live one.
concurrency:
  group: deploy-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Live URL health check
    # workflow_run fires on every CI completion; only verify successful pushes
    # to main (the only CI runs that deploy to prod).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # workflow_run runs in the context of main's latest commit, so check out
      # the commit CI actually deployed — the verifier reads the expected
      # version and SHA from the checkout.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Vercel needs ~60-90s after a deploy to fully propagate to its CDN edge.
      # Skip the wait for cron and manual runs — those run against
      # whatever's already live.
      - name: Wait 90s for Vercel CDN propagation
        if: github.event_name == 'workflow_run'
        run: sleep 90

      - name: Run deploy verifier
        id: verify
        continue-on-error: true
        run: node tests/deploy-verify.js

      - name: Open issue on FAIL
        if: steps.verify.outputs.status == 'FAIL'
        uses: actions/github-script@v9
        env:
          REPORT_FILE: ${{ steps.verify.outputs.report_file }}
          VERSION: ${{ steps.verify.outputs.version }}
          SHORT_SHA: ${{ steps.verify.outputs.short_sha }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            const title = `Deploy verification: v${process.env.VERSION} @ ${process.env.SHORT_SHA} — FAIL`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deploy-verification', 'bug', 'priority: high']
            });

      - name: Open issue on script crash
        if: steps.verify.outcome == 'failure' && steps.verify.outputs.status == ''
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy verifier crashed — workflow run #${context.runId}`,
              body: [
                '## Deploy verifier crashed before producing a report',
                '',
                'The verification script exited non-zero without writing a report file.',
                'Likely causes: network failure reaching Vercel, source-file parsing error, ',
                'missing tools in the runner.',
                '',
                `**Workflow run:** ${runUrl}`,
                '',
                '@oremosu98 — investigate the run logs to determine root cause.'
              ].join('\n'),
              labels: ['deploy-verification', 'bug', 'priority: high']
            });

      # Only fail the actual workflow status on FAIL — WARN should not turn CI red.
      - name: Mark job failed on FAIL
        if: steps.verify.outputs.status == 'FAIL'
        run: |
          echo "Deploy verification failed — see issue created above."
          exit 1
