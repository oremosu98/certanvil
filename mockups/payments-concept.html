<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CertAnvil · Payments (concept)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet" />
<style>
/* ════════════════════════════════════════════════════════════════════════
   CertAnvil · MOCKUP STARTER TOKEN BLOCK
   ────────────────────────────────────────────────────────────────────────
   Copy this into the <style> of every new mockup. Do NOT eyeball hex —
   freehand token blocks are how the 2026-06-12 Gauntlet-mockup drift
   happened (accent pulled 9-19° toward gold, Tailwind pass/fail greens).
   Values = BRAND.md §3 / live dg-system.css. Audit trail:
   mockups branch audit-workspace/brand-audit.md.

   Reminders that pair with this block (BRAND.md §4-§9):
   · easing is ONLY cubic-bezier(0.16, 1, 0.3, 1); entrances start
     scale(0.96-0.98); hover gated (hover:hover) and (pointer:fine)
   · Fraunces numbers: font-variant-numeric: lining-nums tabular-nums;
     font-feature-settings: "lnum","tnum";
   · eyebrows: Inter 800, 10-11px, tracking 0.08-0.14em (never more)
   · shadows/tints: color-mix(in oklab, var(--ink) N%, transparent) —
     never rgba()/hex on chrome
   · no emoji decoration (semantic ✓ ✗ → only) · no em dashes in copy
   ════════════════════════════════════════════════════════════════════════ */

/* ── App-surface mockups (dual theme; --accent-deep = text-accent role) ── */
:root, [data-theme="dark"] {
  --bg: oklch(0.17 0.008 275); --surface: oklch(0.205 0.009 275); --surface-2: oklch(0.23 0.009 275);
  --ink: oklch(0.96 0.006 275); --ink-soft: oklch(0.80 0.012 275); --muted: oklch(0.725 0.013 275);
  --border: oklch(0.32 0.011 275); --border-soft: oklch(0.255 0.010 275);
  --accent: oklch(0.80 0.155 64); --accent-deep: oklch(0.86 0.135 64); --on-accent: oklch(0.18 0.020 275);
  --pass: oklch(0.74 0.150 152); --fail: oklch(0.66 0.17 25);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="light"] {
  --bg: oklch(0.975 0.007 85); --surface: oklch(0.992 0.004 85); --surface-2: oklch(0.965 0.010 84);
  --ink: oklch(0.22 0.015 280); --ink-soft: oklch(0.36 0.014 280); --muted: oklch(0.50 0.013 280);
  --border: oklch(0.86 0.008 85); --border-soft: oklch(0.91 0.006 85);
  --accent: oklch(0.50 0.155 55); --accent-deep: oklch(0.42 0.150 52); --on-accent: oklch(0.985 0.010 85);
  --pass: oklch(0.50 0.15 150); --fail: oklch(0.52 0.19 25);
}
/* --warn is the only token this mockup adds, taken verbatim from BRAND.md §3. */
:root, [data-theme="dark"] { --warn: oklch(0.80 0.130 75); }
[data-theme="light"] { --warn: oklch(0.62 0.14 70); }

/* ════════ Motion tokens (BRAND.md §6, re-timed; transitions.dev choreography only) ════════
   press 160ms · hover/lift 200ms · swap 220ms · overlay/toast 380ms · surface reveal 520ms   */
:root {
  --t-press: 160ms; --t-lift: 200ms; --t-swap: 220ms; --t-ov: 380ms; --t-reveal: 520ms; --t-exit: 200ms;
  --scrim: color-mix(in oklab, oklch(0.14 0.012 275) 52%, transparent);
  --shadow-lg: 0 1px 0 color-mix(in oklab, var(--ink) 4%, transparent), 0 18px 40px -16px color-mix(in oklab, var(--ink) 22%, transparent);
}

* { box-sizing: border-box; }
html { color-scheme: light dark; }
[data-theme="dark"] { color-scheme: dark; } [data-theme="light"] { color-scheme: light; }
body { margin: 0; background: color-mix(in oklab, var(--bg) 92%, var(--ink)); color: var(--ink);
  font: 15px/1.55 Inter, -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.num { font-family: Fraunces, Georgia, serif; font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum", "tnum"; }
.eyebrow { display: block; font: 800 11px/1.2 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-deep); }
.eyebrow.dim { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ════════ HUD (harness chrome, not part of the product) ════════ */
.hud { position: sticky; top: 0; z-index: 30; padding: 16px 24px 12px;
  background: color-mix(in oklab, var(--bg) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft); }
.hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; max-width: 1480px; margin: 0 auto; }
.hud-title { font: 600 22px/1.15 Fraunces, Georgia, serif; letter-spacing: -.012em; margin: 4px 0 0; }
.hud-ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.hud-rows { max-width: 1480px; margin: 12px auto 0; display: grid; gap: 8px; }
.hud-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hud-row .lbl { font: 800 10px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); width: 64px; flex: none; }
.chip { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); border-radius: 999px;
  min-height: 36px; padding: 0 14px; font: 650 12.5px/1 Inter, sans-serif; cursor: pointer; transition: transform var(--t-press) var(--ease); }
.chip b { font-weight: 800; color: var(--muted); margin-right: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] b { color: inherit; opacity: .75; }
.chip:active { transform: scale(.97); }
.hud-note { max-width: 1480px; margin: 10px auto 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.hud-note b { color: var(--ink-soft); }

/* ════════ Stage + frames ════════ */
.stage { max-width: 1480px; margin: 0 auto; padding: 28px 24px 80px; }
.frames { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; }
.fr { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.fr figcaption { font: 700 11px/1 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
/* desktop browser window */
.win { width: 1000px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); box-shadow: var(--shadow-lg); }
.win-bar { height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); }
.dots { display: inline-flex; gap: 7px; } .dots i { width: 11px; height: 11px; border-radius: 99px; background: var(--border); display: block; }
.url { flex: 1; max-width: 460px; margin: 0 auto; height: 26px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 12px/1 Inter, sans-serif; color: var(--muted); }
.url svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.view { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }
.win .view { height: 740px; }
.scroller { height: 100%; overflow-y: auto; overscroll-behavior: contain; container-type: inline-size; }
.scroller::-webkit-scrollbar { width: 0; }
/* phones */
.phone { width: 390px; height: 844px; border-radius: 52px; padding: 11px; flex: none;
  background: linear-gradient(165deg, #23262f, #0c0d11); box-shadow: 0 40px 90px -34px rgba(0,0,0,0.55), 0 0 0 1.5px rgba(255,255,255,0.06) inset; }
.screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  --safe-top: 47px; --safe-bottom: 34px; /* simulated env(safe-area-inset-*) for a 390pt iPhone */ }
.notch { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 122px; height: 32px; background: #07080b; border-radius: 18px; z-index: 9; }
.statusbar { flex: none; height: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding: 4px 28px 0; font: 700 14px/1 Inter, sans-serif; }
.sb-ic { display: inline-flex; gap: 5px; } .sb-ic i { display: block; width: 17px; height: 10px; border-radius: 3px; background: currentColor; opacity: .85; }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 99px; background: var(--ink); opacity: .85; z-index: 9; }
.screen .view { flex: 1; min-height: 0; }
.safari { flex: none; padding: 6px 14px 8px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); }
.safari .url { max-width: none; height: 34px; border-radius: 11px; font-size: 13px; }

/* ════════ Buttons (press = scale .97; hover tint = opacity layer, so only transform + opacity move) ════════ */
.btn { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
  font: 650 15px/1 Inter, sans-serif; transition: transform var(--t-press) var(--ease); }
.btn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: currentColor; opacity: 0; transition: opacity var(--t-lift) var(--ease); }
@media (hover: hover) and (pointer: fine) { .btn:not([disabled]):hover::after { opacity: .07; } }
.btn:active:not([disabled]) { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid color-mix(in oklab, var(--accent) 60%, transparent); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 22px -14px color-mix(in oklab, var(--accent) 80%, transparent); }
.btn-primary::after { background: var(--on-accent); }
.btn-ghost { background: transparent; color: var(--accent-deep); border-color: color-mix(in oklab, var(--accent) 36%, var(--border)); }
.btn-quiet { background: transparent; color: var(--ink-soft); border-color: var(--border); }
.btn-text { background: transparent; color: var(--ink-soft); border-color: transparent; font-weight: 600; }
.btn-white { background: var(--on-accent); color: var(--accent-deep); }
.btn-danger { background: var(--fail); color: var(--on-accent); }
[data-theme="dark"] .btn-danger { color: oklch(0.18 0.020 275); }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; padding: 0 16px; font-size: 14px; border-radius: 11px; }
.lnk { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; color: var(--accent-deep); font-weight: 650; text-decoration: underline;
  text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; }
.lnk svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ticks list */
.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.ticks li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.45; color: var(--ink-soft); }
.ticks li b { color: var(--ink); font-weight: 650; }
.ticks svg { flex: none; width: 17px; height: 17px; margin-top: 2px; stroke: var(--accent-deep); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font: 800 10.5px/1 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent-deep); background: color-mix(in oklab, var(--accent) 12%, transparent); border: 1px solid color-mix(in oklab, var(--accent) 28%, var(--border)); }
.pill.pass { color: var(--pass); background: color-mix(in oklab, var(--pass) 11%, transparent); border-color: color-mix(in oklab, var(--pass) 30%, var(--border)); }
.pill.warn { color: color-mix(in oklab, var(--warn) 75%, var(--ink)); background: color-mix(in oklab, var(--warn) 14%, transparent); border-color: color-mix(in oklab, var(--warn) 36%, var(--border)); }
.pill.dim { color: var(--muted); background: color-mix(in oklab, var(--ink) 5%, transparent); border-color: var(--border); }

/* ════════ Landing chrome (certanvil.com) ════════ */
.site-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 32px;
  background: color-mix(in oklab, var(--bg) 86%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-soft); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; min-height: 44px; }
.mark { width: 30px; height: 30px; fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.mark .c-slash { stroke: var(--muted); stroke-width: 5; }
.logo-name { font: 600 19px/1 Fraunces, Georgia, serif; letter-spacing: -.01em; color: var(--ink); }
.nav { display: flex; align-items: center; gap: 4px; }
.nav a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; font: 600 14px/1 Inter, sans-serif; color: var(--ink-soft); text-decoration: none; border-radius: 10px; }
.nav a[aria-current="page"] { color: var(--ink); }
.avatar { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; font: 700 13px/1 Inter, sans-serif; color: var(--accent-deep);
  background: color-mix(in oklab, var(--accent) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 30%, var(--border)); }
.avatar-btn { min-width: 44px; min-height: 44px; display: grid; place-items: center; }
@container (max-width: 620px) {
  .site-top { padding: 10px 16px; }
  .nav a.wide { display: none; }
}
.site-foot { border-top: 1px solid var(--border-soft); padding: 28px 32px 36px; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; justify-content: space-between; }
.site-foot nav { display: flex; flex-wrap: wrap; gap: 0 18px; }
.site-foot a { min-height: 44px; display: inline-flex; align-items: center; color: var(--ink-soft); font-size: 13.5px; text-decoration: none; }
.site-foot small { color: var(--muted); font-size: 12.5px; }
@container (max-width: 620px) { .site-foot { padding: 22px 16px 30px; flex-direction: column; align-items: flex-start; } }

/* ════════ A · Pricing ════════ */
.pr { max-width: 1040px; margin: 0 auto; padding: 56px 32px 36px; }
.pr-hero { text-align: center; max-width: 640px; margin: 0 auto 30px; }
.pr-h1 { font: 600 clamp(30px, 5cqi, 52px)/1.06 Fraunces, Georgia, serif; letter-spacing: -.025em; margin: 14px 0 0; text-wrap: balance; }
.pr-sub { color: var(--ink-soft); font-size: 16px; line-height: 1.6; margin: 16px auto 0; max-width: 54ch; }
.notice { display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 560px; margin: 0 auto 22px; padding: 12px 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); font-size: 14px; color: var(--ink-soft); }
.notice svg { width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.launch { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin: 0 0 18px; padding: 16px 20px; border-radius: 16px;
  background: color-mix(in oklab, var(--accent) 8%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 26%, var(--border)); }
.launch-l { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.launch-fig { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1; color: var(--ink); }
.launch-fig s { font-size: 19px; color: var(--muted); margin-right: 6px; text-decoration-thickness: 1.5px; }
.launch-txt { font-size: 14.5px; color: var(--ink-soft); }
.launch-ends { font: 650 13px/1.3 Inter, sans-serif; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px; }
.launch-ends svg { width: 15px; height: 15px; stroke: var(--accent-deep); fill: none; stroke-width: 2; }
.pr-grid { display: grid; grid-template-columns: 1.45fr 1fr; gap: 20px; align-items: stretch; }
@container (max-width: 760px) { .pr { padding: 36px 16px 28px; } .pr-grid { grid-template-columns: 1fr; } .launch { padding: 14px 16px; } }
.pr-pro { border-radius: 22px; padding: clamp(22px, 3.2cqi, 36px); background: var(--accent); color: var(--on-accent); display: flex; flex-direction: column;
  box-shadow: 0 1px 0 color-mix(in oklab, var(--ink) 4%, transparent), 0 30px 60px -30px color-mix(in oklab, var(--accent) 70%, transparent); }
.pr-pro-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tier { font: 800 12px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; opacity: .88; }
.pr-pro .tag { font: 600 21px/1.25 Fraunces, Georgia, serif; letter-spacing: -.01em; margin: 10px 0 18px; }
/* currency switcher */
.cur { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: color-mix(in oklab, var(--on-accent) 14%, transparent); }
.cur button { appearance: none; border: 0; background: transparent; cursor: pointer; min-width: 44px; height: 38px; border-radius: 999px; padding: 0 10px;
  font: 700 13px/1 Inter, sans-serif; color: color-mix(in oklab, var(--on-accent) 80%, transparent); transition: transform var(--t-press) var(--ease); }
.cur button[aria-checked="true"] { background: var(--on-accent); color: var(--accent-deep); }
.cur button:active { transform: scale(.97); }
.cur.on-surface { background: color-mix(in oklab, var(--ink) 6%, transparent); }
.cur.on-surface button { color: var(--muted); }
.cur.on-surface button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
/* plan rows (radio) */
.plans { display: grid; gap: 10px; margin: 0; }
.plan { position: relative; appearance: none; text-align: left; cursor: pointer; width: 100%; display: grid; grid-template-columns: 22px 1fr; gap: 3px 12px; align-items: center;
  min-height: 64px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); transition: transform var(--t-press) var(--ease); }
.plan:active { transform: scale(.985); }
.plan .ring { grid-row: span 3; width: 22px; height: 22px; border-radius: 999px; border: 2px solid var(--border); position: relative; align-self: center; }
.plan .ring::after { content: ""; position: absolute; inset: 3px; border-radius: 999px; background: var(--accent); opacity: 0; transform: scale(.96); transition: opacity var(--t-press) var(--ease), transform var(--t-press) var(--ease); }
.plan[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.plan[aria-checked="true"] .ring { border-color: var(--accent); }
.plan[aria-checked="true"] .ring::after { opacity: 1; transform: none; }
.plan .p-name { font: 700 15px/1.2 Inter, sans-serif; display: flex; align-items: center; gap: 8px; }
.plan .p-badge { font: 800 10px/1 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px;
  color: var(--accent-deep); background: color-mix(in oklab, var(--accent) 13%, transparent); }
.plan .p-price { grid-column: 2; font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
.plan .p-price s { color: var(--muted); font-size: 15px; margin-right: 4px; text-decoration-thickness: 1.5px; }
.plan .p-price small { font: 600 13px/1 Inter, sans-serif; color: var(--ink-soft); letter-spacing: 0; }
.plan .p-sub { grid-column: 2; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.plans.on-bronze .plan { background: color-mix(in oklab, var(--on-accent) 9%, transparent); border-color: color-mix(in oklab, var(--on-accent) 26%, transparent); color: var(--on-accent); }
.plans.on-bronze .plan[aria-checked="true"] { background: color-mix(in oklab, var(--on-accent) 17%, transparent); border-color: var(--on-accent); box-shadow: 0 0 0 1px var(--on-accent) inset; }
.plans.on-bronze .ring { border-color: color-mix(in oklab, var(--on-accent) 50%, transparent); }
.plans.on-bronze .plan[aria-checked="true"] .ring { border-color: var(--on-accent); }
.plans.on-bronze .ring::after { background: var(--on-accent); }
.plans.on-bronze .p-badge { color: var(--on-accent); background: color-mix(in oklab, var(--on-accent) 18%, transparent); }
.plans.on-bronze .p-sub, .plans.on-bronze .p-price small, .plans.on-bronze .p-price s { color: color-mix(in oklab, var(--on-accent) 80%, transparent); }
.renew { font-size: 13px; line-height: 1.45; color: var(--muted); margin: 10px 0 0; }
.on-bronze-txt { color: color-mix(in oklab, var(--on-accent) 86%, transparent); }
.pr-pro .ticks { margin: 20px 0 22px; }
.pr-pro .ticks li { color: color-mix(in oklab, var(--on-accent) 90%, transparent); }
.pr-pro .ticks li b { color: var(--on-accent); }
.pr-pro .ticks svg { stroke: var(--on-accent); }
.pr-pro .btn-white { margin-top: auto; }
.trust { list-style: none; margin: 16px 0 0; padding: 14px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-size: 12.5px; line-height: 1.35; font-weight: 600;
  border-top: 1px solid color-mix(in oklab, var(--on-accent) 22%, transparent); }
.trust li { display: flex; gap: 7px; align-items: flex-start; }
.trust li svg { flex: none; width: 13px; height: 13px; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
@container (max-width: 420px) { .trust { grid-template-columns: 1fr; } }
.pr-pro .trust { color: color-mix(in oklab, var(--on-accent) 84%, transparent); }
.pr-free { border-radius: 18px; padding: clamp(22px, 2.6cqi, 30px); background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; }
.pr-free .tier { color: var(--muted); opacity: 1; }
.free-fig { font-size: 48px; font-weight: 600; letter-spacing: -.03em; line-height: 1; margin: 14px 0 4px; }
.free-fig small { font: 600 14px/1 Inter, sans-serif; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.pr-free .tag { font: 600 15px/1.4 Fraunces, Georgia, serif; color: var(--ink-soft); margin: 6px 0 16px; }
.pr-free .ticks { margin-bottom: 22px; } .pr-free .ticks li { font-size: 14px; }
.pr-free .btn { margin-top: auto; }
.pr-anchor { text-align: center; margin: 26px auto 0; max-width: 56ch; font-size: 15px; line-height: 1.55; color: var(--ink-soft); text-wrap: balance; }
.pr-anchor b { color: var(--ink); }
/* owned (already Pro) */
.owned-h { font: 600 40px/1.05 Fraunces, Georgia, serif; letter-spacing: -.02em; margin: 14px 0 8px; }
.owned-p { font-size: 15px; line-height: 1.5; margin: 0; color: color-mix(in oklab, var(--on-accent) 88%, transparent); }
.owned-actions { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: auto; padding-top: 22px; }
.owned-actions .lnk { color: var(--on-accent); }
/* FAQ */
.faq { max-width: 760px; margin: 0 auto; padding: 30px 32px 56px; }
.faq h2 { font: 600 clamp(26px, 3.6cqi, 34px)/1.15 Fraunces, Georgia, serif; letter-spacing: -.02em; text-align: center; margin: 10px 0 24px; }
.faq .eyebrow { text-align: center; }
.faq-list { border-top: 1px solid var(--border); }
.faq details { border-bottom: 1px solid var(--border); }
.faq summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 14px 2px; font: 600 15.5px/1.35 Inter, sans-serif; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { flex: none; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform var(--t-lift) var(--ease); }
.faq details[open] summary svg { transform: rotate(180deg); stroke: var(--accent-deep); }
.faq .a { padding: 0 2px 20px; font-size: 14.5px; line-height: 1.65; color: var(--ink-soft); max-width: 66ch; }
.faq details[open] .a { animation: fadeUp var(--t-swap) var(--ease) backwards; }
@container (max-width: 620px) { .faq { padding: 22px 16px 40px; } }

/* ════════ Overlays: sheet (phones) + dialog (desktop) ════════ */
.ov { position: absolute; inset: 0; z-index: 6; display: flex; }
.ov-bd { position: absolute; inset: 0; background: var(--scrim); animation: fadeIn var(--t-ov) var(--ease) backwards; }
.ov.sheet-ov { align-items: flex-end; }
.ov.dlg-ov { align-items: center; justify-content: center; padding: 24px; }
.sheet { position: relative; width: 100%; max-height: calc(100% - 20px); overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 8px 20px calc(18px + var(--safe-bottom, 0px)); box-shadow: 0 -18px 40px -20px color-mix(in oklab, var(--ink) 30%, transparent);
  animation: sheetIn var(--t-reveal) var(--ease) backwards; }
.sheet::-webkit-scrollbar { width: 0; }
.grab { width: 38px; height: 5px; border-radius: 99px; background: var(--border); margin: 0 auto 6px; }
.dlg { position: relative; width: min(480px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  padding: 28px; box-shadow: var(--shadow-lg); animation: dlgIn var(--t-ov) var(--ease) backwards; }
.x { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer;
  transition: transform var(--t-press) var(--ease); }
.x:active { transform: scale(.94); }
.x svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.sheet .x { top: 6px; right: 8px; }

/* ════════ B · Paywall ════════ */
.pw { display: flex; flex-direction: column; }
.pw .eyebrow { margin-top: 8px; }
.pw-h { font: 600 26px/1.15 Fraunces, Georgia, serif; letter-spacing: -.015em; margin: 8px 44px 8px 0; text-wrap: balance; }
.pw-p { margin: 0 0 18px; font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); }
.pw .ticks { margin: 18px 0 18px; } .pw .ticks li { font-size: 14px; }
.pw .launch-line { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-soft); display: flex; gap: 7px; align-items: center; }
.pw .launch-line svg { width: 14px; height: 14px; stroke: var(--accent-deep); fill: none; stroke-width: 2; flex: none; }
.pw .renew { margin: 0 0 12px; font-size: 12.5px; text-align: center; }
.pw .btn-text { margin-top: 4px; }
.pw-trust { text-align: center; font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.pw-legal { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 18px; margin-top: 4px; }
.pw-legal .lnk { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.pw-done { text-align: center; padding: 20px 4px 6px; }
.pw-done .pw-h { margin: 14px 0 8px; }
/* gentle nudge line */
.nudge { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 2px 0; border-top: 1px solid var(--border-soft); margin-top: 16px;
  font-size: 13px; color: var(--muted); }
.nudge .lnk { min-height: 44px; font-size: 13px; }

/* ════════ App chrome (web app + iPhone app) ════════ */
.app-top { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--border-soft); background: var(--bg); }
.cert-pill { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); font: 650 13px/1 Inter, sans-serif; color: var(--ink-soft); }
.app-top .grow { flex: 1; }
.app-main { padding: 26px 28px 40px; max-width: 900px; margin: 0 auto; }
.greet { font: 600 28px/1.15 Fraunces, Georgia, serif; letter-spacing: -.015em; margin: 4px 0 18px; }
.card { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); padding: 18px; margin-bottom: 14px; }
.card h3 { font: 650 15px/1.25 Inter, sans-serif; margin: 0 0 6px; }
.card p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }
.rd { display: flex; align-items: baseline; gap: 10px; }
.rd .n { font-size: 46px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.rd small { font: 700 11px/1 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bar { position: relative; height: 8px; border-radius: 99px; background: color-mix(in oklab, var(--ink) 8%, transparent); margin: 16px 0 6px; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent); }
.bar .tick { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); opacity: .55; border-radius: 2px; }
.bar-cap { display: flex; justify-content: space-between; font: 600 12px/1.3 Inter, sans-serif; color: var(--muted); }
.nbm { border-radius: 16px; padding: 18px; background: var(--accent); color: var(--on-accent); margin-bottom: 14px; }
.nbm h3 { font: 600 19px/1.2 Fraunces, Georgia, serif; margin: 6px 0 12px; }
.nbm .eyebrow { color: color-mix(in oklab, var(--on-accent) 80%, transparent); }
.dim-bg { opacity: .9; }
/* iPhone app */
.ios-hdr { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 18px 10px; }
.ios-hdr h1 { flex: 1; font: 600 21px/1.2 Fraunces, Georgia, serif; letter-spacing: -.01em; margin: 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--ink-soft); cursor: pointer; flex: none;
  transition: transform var(--t-press) var(--ease); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.ios-body { padding: 4px 18px 20px; }
.tabbar { flex: none; display: flex; border-top: 1px solid var(--border-soft); background: color-mix(in oklab, var(--bg) 86%, var(--surface)); padding: 6px 8px var(--safe-bottom); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: var(--muted); font: 700 10px/1 Inter, sans-serif; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent-deep); }
/* banner (grace period): full hairline tint, symmetric radius, no left stripe */
.banner { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px; margin-bottom: 16px;
  background: color-mix(in oklab, var(--warn) 10%, var(--surface)); border: 1px solid color-mix(in oklab, var(--warn) 34%, var(--border)); }
.banner .b-ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in oklab, var(--warn) 18%, transparent); color: color-mix(in oklab, var(--warn) 70%, var(--ink)); }
.banner .b-ic svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.banner .b-txt { flex: 1; min-width: 200px; }
.banner b { display: block; font: 650 14.5px/1.35 Inter, sans-serif; }
.banner span { display: block; font-size: 13px; line-height: 1.45; color: var(--ink-soft); margin-top: 2px; }
/* toast (No charge was made) */
.toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 7; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); font: 600 14px/1.3 Inter, sans-serif; white-space: nowrap; animation: toastIn var(--t-ov) var(--ease) backwards; }
.toast svg { width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; }

/* ════════ C · Confirmation ════════ */
.cf { min-height: calc(100% - 64px); display: grid; place-items: center; padding: 48px 20px; }
.cf-card { width: min(520px, 100%); text-align: center; }
.cf-h { font: 600 clamp(30px, 6cqi, 44px)/1.08 Fraunces, Georgia, serif; letter-spacing: -.02em; margin: 14px 0 10px; }
.cf-p { font-size: 15.5px; line-height: 1.55; color: var(--ink-soft); margin: 0 auto; max-width: 42ch; }
.cf-plan { font: 600 14px/1.4 Inter, sans-serif; color: var(--ink-soft); margin: 0; }
.cf .ticks { text-align: left; max-width: 380px; margin: 24px auto 26px; padding: 18px 20px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
.cf-fine { font-size: 13px; line-height: 1.5; color: var(--muted); margin: 14px auto 0; max-width: 44ch; }
.badge { width: 64px; height: 64px; border-radius: 999px; margin: 0 auto; display: grid; place-items: center; color: var(--on-accent); background: var(--accent);
  box-shadow: 0 14px 30px -14px color-mix(in oklab, var(--accent) 80%, transparent); }
.badge svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.badge.soft { background: color-mix(in oklab, var(--accent) 14%, var(--surface)); color: var(--accent-deep); box-shadow: none; border: 1px solid color-mix(in oklab, var(--accent) 30%, var(--border)); }
.spin { width: 44px; height: 44px; margin: 0 auto; border-radius: 999px; border: 3px solid color-mix(in oklab, var(--accent) 18%, transparent); border-top-color: var(--accent);
  animation: spin 800ms linear infinite; }
.checking { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; font: 600 13px/1 Inter, sans-serif; color: var(--muted); }
.checking i { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); animation: pulse 1.6s var(--ease) infinite; }
.cf-swap > * { animation: fadeUp var(--t-reveal) var(--ease) backwards; }
.cf-swap > *:nth-child(2) { animation-delay: 60ms; } .cf-swap > *:nth-child(3) { animation-delay: 120ms; }
.cf-swap > *:nth-child(4) { animation-delay: 180ms; } .cf-swap > *:nth-child(5) { animation-delay: 240ms; } .cf-swap > *:nth-child(n+6) { animation-delay: 300ms; }
.cf-swap .badge { animation: popIn var(--t-reveal) var(--ease) backwards; }

/* ════════ D · Billing + account ════════ */
.bl { max-width: 720px; margin: 0 auto; padding: 40px 32px 48px; }
@container (max-width: 620px) { .bl { padding: 24px 16px 36px; } }
.crumb { font: 600 13px/1 Inter, sans-serif; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.crumb a { text-decoration: none; color: var(--ink-soft); min-height: 44px; display: inline-flex; align-items: center; }
.bl h1 { font: 600 36px/1.1 Fraunces, Georgia, serif; letter-spacing: -.02em; margin: 2px 0 22px; }
.bl-card { border: 1px solid var(--border); border-radius: 18px; background: var(--surface); padding: 22px; }
.bl-card.warn { border-color: color-mix(in oklab, var(--warn) 40%, var(--border)); }
.bl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bl-plan { font: 600 26px/1.15 Fraunces, Georgia, serif; letter-spacing: -.015em; margin: 0; }
.bl-lead { margin: 10px 0 0; font-size: 15px; line-height: 1.55; color: var(--ink-soft); }
.dl { margin: 18px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 0; border-top: 1px solid var(--border-soft); }
.dl dt, .dl dd { margin: 0; padding: 12px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
.dl dt { color: var(--muted); padding-right: 24px; }
.dl dd { color: var(--ink); font-weight: 550; }
.dl dd s { color: var(--muted); font-weight: 500; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
.bl-sec { margin-top: 26px; }
.bl-sec h2 { font: 800 11px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.bl-sec p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
.inline-warn { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: color-mix(in oklab, var(--warn) 10%, transparent);
  border: 1px solid color-mix(in oklab, var(--warn) 32%, var(--border)); }
.inline-warn svg { flex: none; width: 18px; height: 18px; margin-top: 1px; stroke: color-mix(in oklab, var(--warn) 70%, var(--ink)); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.inline-warn b { display: block; font-size: 14.5px; } .inline-warn span { display: block; margin-top: 3px; font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }
.inline-note { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: color-mix(in oklab, var(--accent) 7%, transparent); border: 1px solid color-mix(in oklab, var(--accent) 24%, var(--border)); }
.inline-note b { display: block; font-size: 14.5px; } .inline-note p { margin: 3px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }
.acct-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--border-soft); }
.acct-row .k { font-size: 13px; color: var(--muted); } .acct-row .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
.acct-row .v .sep { color: var(--muted); font-weight: 500; margin: 0 4px; }
/* cancel question */
.opts { display: grid; gap: 8px; margin: 16px 0 0; }
.opt { appearance: none; width: 100%; text-align: left; cursor: pointer; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); font: 600 15px/1.3 Inter, sans-serif; transition: transform var(--t-press) var(--ease); }
.opt:active { transform: scale(.985); }
.opt .ring { flex: none; width: 20px; height: 20px; border-radius: 99px; border: 2px solid var(--border); position: relative; }
.opt .ring::after { content: ""; position: absolute; inset: 3px; border-radius: 99px; background: var(--accent); opacity: 0; transform: scale(.96); transition: opacity var(--t-press) var(--ease), transform var(--t-press) var(--ease); }
.opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt[aria-checked="true"] .ring { border-color: var(--accent); } .opt[aria-checked="true"] .ring::after { opacity: 1; transform: none; }
.follow { margin-top: 14px; padding: 16px; border-radius: 14px; background: color-mix(in oklab, var(--accent) 7%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 22%, var(--border));
  animation: fadeUp var(--t-swap) var(--ease) backwards; }
.follow b { display: block; font: 600 18px/1.25 Fraunces, Georgia, serif; }
.follow p { margin: 4px 0 12px; font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
.follow textarea { width: 100%; min-height: 88px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); padding: 10px 12px; font-size: 14px; resize: vertical; }
.dlg-foot { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.dlg-foot .btn { flex: 1 1 160px; }
/* delete */
.field { display: grid; gap: 6px; margin-top: 18px; }
.field label { font: 600 13.5px/1.3 Inter, sans-serif; color: var(--ink-soft); }
.field input { height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 14px; font-size: 16px; letter-spacing: .04em; }
.field input:focus { outline: 2px solid color-mix(in oklab, var(--accent) 50%, transparent); outline-offset: 1px; }
.gone { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.gone li { display: flex; gap: 10px; font-size: 14px; color: var(--ink-soft); }
.gone li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 99px; background: var(--muted); margin-top: 8px; }
/* settings rows (iPhone) */
.sect { font: 800 10.5px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 10px; }
.group { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; border: 0; background: none; width: 100%; text-align: left; text-decoration: none; color: var(--ink); cursor: pointer; }
.row + .row { border-top: 1px solid var(--border-soft); }
.row .r-l { flex: 1; font: 600 15px/1.3 Inter, sans-serif; }
.row .r-l small { display: block; font: 500 12.5px/1.35 Inter, sans-serif; color: var(--muted); margin-top: 2px; }
.row .r-v { font-size: 14px; color: var(--muted); }
.row svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.row.static { cursor: default; }
.row.accent .r-l { color: var(--accent-deep); }

/* ════════ F · Diagnostic ════════ */
.dx { max-width: 760px; margin: 0 auto; padding: 48px 32px 48px; }
@container (max-width: 620px) { .dx { padding: 28px 16px 36px; } }
.dx-score { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 14px 0 0; }
.dx-score .n { font-size: clamp(76px, 15cqi, 112px); font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.dx-score .cap { font: 700 12px/1.35 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 12px; }
.dx-gap { font: 600 20px/1.35 Fraunces, Georgia, serif; margin: 14px 0 0; }
.dx-dom { margin: 26px 0 0; display: grid; gap: 12px; }
.dx-dom .d { display: grid; grid-template-columns: 1fr 44px; gap: 6px 12px; align-items: center; font-size: 14px; color: var(--ink-soft); }
.dx-dom .d .pct { text-align: right; font: 600 14px/1 Inter, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
.dx-dom .d .bar { grid-column: 1 / -1; margin: 0; height: 6px; }
.dx-dom .d.weak .bar i { background: var(--warn); }
.dx-plan { margin: 22px 0 0; font-size: 15px; line-height: 1.55; color: var(--ink-soft); }
.dx-cta { display: grid; gap: 10px; margin-top: 28px; max-width: 460px; }
.dx-cta .cf-fine { margin: 2px 0 0; text-align: left; }

/* ════════ Preview screens (feature lock) ════════ */
.lockprev { position: relative; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); padding: 16px; overflow: hidden; }

/* ═════════════ HUD + render ═════════════ */
var stage = document.getElementById('stage'), frames = document.getElementById('frames'), timer = null;
function scr() { return SCREENS.filter(function (s) { return s.id === S.screen; })[0]; }
function st() { var s = scr(); return s.states.filter(function (x) { return x.id === S.state; })[0] || s.states[0]; }
function chip(label, on, data, key) { return '<button class="chip" type="button" aria-pressed="' + on + '" ' + data + '>' + (key ? '<b>' + key + '</b>' : '') + label + '</button>'; }
function hud() {
  document.getElementById('rowScreen').innerHTML = '<span class="lbl">Screen</span>' + SCREENS.map(function (s) { return chip(s.name, s.id === S.screen, 'data-screen="' + s.id + '"', s.id); }).join('');
  document.getElementById('rowState').innerHTML = '<span class="lbl">State</span>' + scr().states.map(function (x) { return chip(x.label, x.id === st().id, 'data-state="' + x.id + '"'); }).join('');
  var ax = document.getElementById('rowAxis');
  ax.innerHTML = scr().axis ? '<span class="lbl">Surface</span>' + scr().axis.map(function (a) { return chip(a[1], a[0] === S.axis, 'data-axis="' + a[0] + '"'); }).join('') : '';
  ax.hidden = !scr().axis;
  document.getElementById('note').innerHTML = st().note || '';
  document.getElementById('launchToggle').textContent = 'Launch window: ' + (S.launch ? 'on' : 'off');
  document.getElementById('launchToggle').setAttribute('aria-pressed', S.launch);
}
function render(local) {
  clearTimeout(timer);
  var keep = [];
  if (local) frames.querySelectorAll('.scroller, .sheet, .dlg').forEach(function (el) { keep.push(el.scrollTop); });
  stage.classList.toggle('is-local', !!local);
  S.state = st().id;
  frames.innerHTML = st().render();
  if (local) frames.querySelectorAll('.scroller, .sheet, .dlg').forEach(function (el, i) { if (keep[i]) el.scrollTop = keep[i]; });
  hud();
  try { history.replaceState(null, '', '#' + S.screen + '/' + S.state + (scr().axis ? '/' + S.axis : '')); } catch (e) {}
  var a = st().after;
  if (a && !local) timer = setTimeout(function () { S.state = a[0]; render(false); }, a[1]);
}
function go(path) {
  var p = path.split('/');
  S.screen = p[0]; S.state = p[1] || scr().states[0].id; if (p[2]) S.axis = p[2]; S.reason = null; S.plan = 'yearly';
  render(false); window.scrollTo({ top: 0 });
}

document.addEventListener('click', function (e) {
  var x = e.target.closest('.x');
  if (x) { var ov = x.closest('.ov'); ov.classList.add('is-closing'); setTimeout(function () { ov.remove(); }, 210); return; }
  var t = e.target.closest('[data-screen],[data-state],[data-axis],[data-cur],[data-plan],[data-reason],[data-go],a[href="#"]');
  if (!t) return;
  if (t.matches('a[href="#"]') && !t.dataset.go) { e.preventDefault(); return; }
  e.preventDefault();
  if (t.dataset.screen) { S.screen = t.dataset.screen; S.state = scr().states[0].id; S.reason = null; S.plan = 'yearly'; render(false); }
  else if (t.dataset.state) { S.state = t.dataset.state; S.reason = null; S.plan = 'yearly'; render(false); }
  else if (t.dataset.axis) { S.axis = t.dataset.axis; render(false); }
  else if (t.dataset.cur) { S.cur = t.dataset.cur; render(true); }
  else if (t.dataset.plan) { S.plan = t.dataset.plan; render(true); }
  else if (t.dataset.reason) { S.reason = t.dataset.reason; render(true); }
  else if (t.dataset.go) {
    var g = t.dataset.go;
    if (g === 'B/already' && S.screen === 'B') { S.state = 'already'; render(false); return; }
    go(g);
  }
});
document.addEventListener('input', function (e) {
  if (!e.target.matches('[data-del]')) return;
  var btn = e.target.closest('.bl, .ios-body').querySelector('[data-del-btn]');
  if (btn) btn.disabled = e.target.value.trim().toUpperCase() !== 'DELETE';
});
document.getElementById('themeToggle').addEventListener('click', function () {
  S.theme = S.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', S.theme);
  this.textContent = S.theme === 'light' ? 'Dark theme' : 'Light theme';
  this.setAttribute('aria-pressed', S.theme === 'dark');
  try { localStorage.setItem('ca-pay-theme', S.theme); } catch (err) {}
});
document.getElementById('launchToggle').addEventListener('click', function () { S.launch = !S.launch; render(true); });
document.getElementById('replay').addEventListener('click', function () { render(false); });

try { var th = localStorage.getItem('ca-pay-theme'); if (th === 'dark' || th === 'light') { S.theme = th; document.documentElement.setAttribute('data-theme', th); document.getElementById('themeToggle').textContent = th === 'light' ? 'Dark theme' : 'Light theme'; } } catch (err) {}
var h = (location.hash || '').replace('#', '').split('/');
if (h[0] && SCREENS.some(function (s) { return s.id === h[0]; })) { S.screen = h[0]; if (h[1]) S.state = h[1]; if (h[2]) S.axis = h[2]; }
render(false);
window.__PAY = { SCREENS: SCREENS, S: S, go: go, render: render };
})();
</script>
