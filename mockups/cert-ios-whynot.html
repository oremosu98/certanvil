<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CertAnvil · Why-Not (iOS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Forged-bronze tokens (matches dg-system.css + the cert-ios mockups). */
  :root {
    --bg: oklch(0.15 0.010 275); --surface: oklch(0.205 0.009 275); --surface-2: oklch(0.255 0.010 275);
    --ink: oklch(0.97 0.006 275); --ink-soft: oklch(0.80 0.010 275); --muted: oklch(0.62 0.013 275);
    --border: oklch(0.34 0.009 275);
    --accent: oklch(0.82 0.150 66); --accent-bright: oklch(0.88 0.140 72); --accent-deep: oklch(0.72 0.150 62);
    --on-accent: oklch(0.18 0.020 275); --pass: oklch(0.78 0.150 152); --miss: oklch(0.68 0.165 25); --track: oklch(0.30 0.010 275);
    --page-bg: oklch(0.22 0.012 275); --page-ink: oklch(0.92 0.008 275); --page-dim: oklch(0.66 0.012 275);
  }
  [data-theme="light"] {
    --bg: oklch(0.975 0.007 85); --surface: oklch(0.955 0.009 84); --surface-2: oklch(0.92 0.010 84);
    --ink: oklch(0.22 0.015 280); --ink-soft: oklch(0.38 0.014 280); --muted: oklch(0.52 0.013 280);
    --border: oklch(0.85 0.010 85);
    --accent: oklch(0.55 0.155 55); --accent-bright: oklch(0.62 0.150 58); --accent-deep: oklch(0.46 0.150 52);
    --on-accent: oklch(0.99 0.008 85); --pass: oklch(0.52 0.13 150); --miss: oklch(0.55 0.18 25); --track: oklch(0.88 0.010 85);
    --page-bg: oklch(0.93 0.010 84); --page-ink: oklch(0.28 0.015 280); --page-dim: oklch(0.46 0.013 280);
  }
  :root { --ease: cubic-bezier(0.16,1,0.3,1); }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--page-bg); color: var(--page-ink); font: 15px/1.55 Inter, -apple-system, BlinkMacSystemFont, sans-serif; padding: 30px 20px 64px; transition: background .35s var(--ease), color .35s var(--ease); }
  .stage { max-width: 520px; margin: 0 auto; }
  .stage-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .stage-eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-bright); margin: 0 0 7px; }
  .stage-title { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; letter-spacing: -0.012em; margin: 0; color: var(--page-ink); }
  .stage-sub { color: var(--page-dim); font-size: 13px; margin: 7px 0 0; max-width: 48ch; line-height: 1.5; }
  .theme-toggle { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; font: 600 12px/1 Inter, sans-serif; color: var(--accent-bright); background: transparent; border: 1px solid color-mix(in oklab, var(--accent-bright) 38%, var(--page-dim)); border-radius: 999px; padding: 8px 13px; cursor: pointer; }
  .theme-toggle svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .phone-wrap { display: flex; flex-direction: column; align-items: center; }
  .phone { width: 390px; height: 844px; border-radius: 52px; padding: 11px; flex: 0 0 auto; background: linear-gradient(165deg, #23262f, #0c0d11); box-shadow: 0 40px 90px -34px rgba(0,0,0,0.6), 0 0 0 1.5px rgba(255,255,255,0.06) inset; }
  .screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; transition: background .35s var(--ease), color .35s var(--ease); }
  .notch { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 122px; height: 32px; background: #07080b; border-radius: 18px; z-index: 12; }
  .statusbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px 0; font: 700 13px/1 Inter, sans-serif; color: var(--ink); }
  .sb-icons { display: inline-flex; gap: 6px; align-items: center; }
  .sb-icons svg { width: 17px; height: 12px; fill: var(--ink); }
  svg.i { stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

  .body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 20px; }
  .body::-webkit-scrollbar { width: 0; }
  .card { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); padding: 15px 16px; margin-bottom: 11px; }
  .sect { font: 800 10px/1 Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 10px; }

  /* ── start screen ── */
  .hdr { display: flex; align-items: center; gap: 11px; padding: 14px 20px 6px; }
  .back { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--ink-soft); cursor: pointer; }
  .back svg { width: 16px; height: 16px; }
  .hdr h1 { font: 600 21px/1 Fraunces, Georgia, serif; letter-spacing: -0.01em; margin: 0; color: var(--ink); flex: 1; }
  .plan-tag { font: 800 9.5px/1 Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 6px 9px; }
  .hero { text-align: center; padding: 10px 6px 4px; }
  .hero-i { width: 58px; height: 58px; border-radius: 999px; margin: 6px auto 14px; display: grid; place-items: center; color: var(--accent-deep); background: color-mix(in oklab, var(--accent) 12%, var(--surface)); }
  .hero-i svg { width: 26px; height: 26px; }
  .hero h2 { font: 600 26px/1.1 Fraunces, Georgia, serif; letter-spacing: -0.014em; margin: 0; color: var(--ink); }
  .hero h2 em { font-style: italic; color: var(--accent); }
  .hero p { font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); margin: 10px auto 0; max-width: 32ch; }
  .seg { display: flex; gap: 6px; padding: 5px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); }
  .seg button { flex: 1 1 0; text-align: left; border: 1px solid transparent; border-radius: 11px; background: none; padding: 10px 11px; cursor: pointer; font: inherit; color: var(--ink); transition: background-color .18s, border-color .18s, transform .14s var(--ease); }
  .seg button:active { transform: scale(0.98); }
  .seg b { display: flex; align-items: center; gap: 6px; font: 700 14px/1.2 Inter, sans-serif; }
  .seg button > span { display: block; font: 500 11.5px/1.35 Inter, sans-serif; color: var(--muted); margin-top: 3px; }
  .seg .on { background: color-mix(in oklab, var(--accent) 9%, var(--bg)); border-color: color-mix(in oklab, var(--accent) 40%, var(--border)); }
  .seg .on b { color: var(--accent-deep); }
  .lock-pill { display: inline-flex; align-items: center; gap: 4px; font: 800 9px/1 Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); border: 1px solid color-mix(in oklab, var(--accent) 34%, var(--border)); background: color-mix(in oklab, var(--accent) 9%, transparent); border-radius: 999px; padding: 4px 7px; }
  .lock-pill svg { width: 10px; height: 10px; stroke-width: 2.4; }
  .target .k { font: 800 9.5px/1 Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .target .v { font: 650 16px/1.3 Inter, sans-serif; color: var(--ink); margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .rchip { min-height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 0 16px; font: 650 14px/1 Inter, sans-serif; color: var(--ink-soft); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: transform .14s var(--ease); }
  .rchip:active { transform: scale(0.97); }
  .rchip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .rchip.locked { color: var(--muted); }
  .rchip svg { width: 12px; height: 12px; stroke-width: 2.4; }
  /* entry, rebuilt in the custom-quiz language */
  .en-hdr { align-items: flex-start; }
  .en-title { flex: 1 1 auto; min-width: 0; padding-top: 1px; }
  .en-title h1 { font: 600 21px/1.05 Fraunces, Georgia, serif; letter-spacing: -0.01em; margin: 0; color: var(--ink); }
  .en-title span { display: block; font: 500 11.5px/1.3 Inter, sans-serif; color: var(--muted); margin-top: 4px; }
  .cert-strip { display: flex; align-items: center; gap: 10px; margin: 10px 2px 4px; }
  .cert-strip .cm { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; background: color-mix(in oklab, var(--accent) 13%, var(--surface-2)); color: var(--accent-deep); display: grid; place-items: center; font: 800 11px/1 Inter, sans-serif; }
  .cert-strip .cn b { display: block; font: 650 13.5px/1.05 Inter, sans-serif; color: var(--ink); }
  .cert-strip .cn span { display: block; font: 600 10.5px/1 'Roboto Mono', monospace; color: var(--muted); margin-top: 2px; }
  .en-lead { font: 500 13.5px/1.5 Inter, sans-serif; color: var(--ink-soft); margin: 12px 2px 0; max-width: 36ch; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .mode { text-align: left; border: 1.5px solid var(--border); background: var(--surface); border-radius: 15px; padding: 13px 13px 12px; cursor: pointer; font: inherit; color: var(--ink); transition: border-color .18s, background-color .18s, transform .12s var(--ease); }
  .mode:active { transform: scale(0.985); }
  .mode .mi { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in oklab, var(--accent) 10%, var(--surface-2)); display: grid; place-items: center; margin-bottom: 10px; color: var(--accent-deep); }
  .mode .mi svg { width: 18px; height: 18px; }
  .mode b { display: flex; align-items: center; gap: 6px; font: 650 14px/1.1 Inter, sans-serif; color: var(--ink); }
  .mode > span:last-child { display: block; font: 500 11.5px/1.35 Inter, sans-serif; color: var(--muted); margin-top: 4px; }
  .mode .tick { margin-left: auto; display: grid; color: var(--accent-deep); opacity: 0; }
  .mode .tick svg { width: 16px; height: 16px; stroke-width: 2.6; }
  .mode[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 7%, var(--surface)); }
  .mode[aria-pressed="true"] .tick { opacity: 1; }
  .pro-tag { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; font: 800 9px/1 Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-deep); background: color-mix(in oklab, var(--accent) 12%, var(--surface-2)); border-radius: 999px; padding: 4px 7px; }
  .pro-tag svg { width: 9px; height: 9px; stroke-width: 2.6; }
  .count-echo { display: flex; align-items: baseline; gap: 9px; margin: 2px 2px 8px; }
  .count-echo .bn { font: 600 44px/1 Fraunces, serif; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
  .count-echo .bl { font: 700 11px/1 Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .cseg { display: flex; gap: 5px; background: color-mix(in oklab, var(--ink) 5%, var(--surface-2)); border: 1px solid var(--border); border-radius: 13px; padding: 4px; }
  .cseg button { flex: 1 1 0; min-height: 40px; border: none; background: transparent; cursor: pointer; border-radius: 9px; font: 700 14px/1 Inter, sans-serif; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: background-color .2s var(--ease), color .2s, transform .14s var(--ease); }
  .cseg button:active { transform: scale(0.96); }
  .cseg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 14px -8px color-mix(in oklab, var(--accent) 70%, transparent); }
  .cseg button.locked { color: color-mix(in oklab, var(--muted) 75%, transparent); }
  .cseg button svg { width: 11px; height: 11px; stroke-width: 2.4; }
  .cap-note { margin: 9px 2px 0; font: 600 12px/1.45 Inter, sans-serif; color: var(--muted); }
  .cap-note b { color: var(--ink-soft); }
  .en-dock { flex-direction: column; gap: 0; }
  .en-dock .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .en-dock .btn-primary svg { width: 14px; height: 14px; fill: currentColor; stroke: none; }
  .en-dock .qc { font: 700 12px/1 'Roboto Mono', monospace; opacity: 0.82; }
  .foot-note { text-align: center; font: 500 10.5px/1.3 Inter, sans-serif; color: var(--muted); margin: 9px 0 0; }
  .free-note { font: 500 11.5px/1.45 Inter, sans-serif; color: var(--muted); text-align: center; margin: 14px 8px 2px; }

  /* ── session top bar (Leave · Round pill · timer) + ticks ── */
  .rbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px 8px; }
  .leave { flex: 0 0 auto; font: 650 12.5px/1 Inter, sans-serif; color: var(--ink-soft); border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
  .rpill { font: 800 10.5px/1 Inter, sans-serif; letter-spacing: 0.04em; color: var(--accent-deep); background: color-mix(in oklab, var(--accent) 11%, transparent); border: 1px solid color-mix(in oklab, var(--accent) 30%, var(--border)); border-radius: 999px; padding: 6px 10px; }
  .rspace { flex: 1; }
  .timer { display: inline-flex; align-items: center; gap: 5px; font: 700 14px/1 'Roboto Mono', monospace; color: var(--ink); font-variant-numeric: tabular-nums; }
  .timer svg { width: 13px; height: 13px; stroke: var(--accent-deep); }
  .ticks { display: flex; gap: 5px; padding: 2px 18px 6px; }
  .ticks i { flex: 1 1 0; height: 5px; border-radius: 3px; background: var(--track); }
  .ticks i.done { background: color-mix(in oklab, var(--accent) 55%, var(--track)); }
  .ticks i.cur { background: var(--accent); }

  /* ── round ── */
  .scen .k { display: inline-flex; align-items: center; gap: 7px; font: 800 9.5px/1 Inter, sans-serif; letter-spacing: 0.11em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 8px; }
  .scen p { margin: 0; font: 500 13.5px/1.55 Inter, sans-serif; color: var(--ink); }
  .scen mark { background: color-mix(in oklab, var(--accent) 18%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; }
  .con { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; margin-bottom: 11px; }
  .con-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border); font: 700 10.5px/1 'Roboto Mono', monospace; color: var(--muted); }
  .con-bar b { color: var(--ink-soft); font-weight: 700; }
  .reset-pill { border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--ink-soft); font: 700 11px/1 Inter, sans-serif; padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .reset-pill svg { width: 12px; height: 12px; stroke-width: 2.2; }
  .con-body { padding: 11px 12px; font: 500 11.5px/1.65 'Roboto Mono', monospace; color: var(--ink-soft); }
  .con-body .ln { display: block; white-space: pre; overflow-x: auto; }
  .con-body .ln.hit { color: var(--accent-deep); font-weight: 700; }
  .con-body .pr { color: var(--accent-deep); font-weight: 700; }
  .ref .ref-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .ref .ref-head span { font: 800 9.5px/1 Inter, sans-serif; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); }
  .enlarge { border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--accent-deep); font: 700 11px/1 Inter, sans-serif; padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .enlarge svg { width: 12px; height: 12px; stroke-width: 2.2; }
  .net { width: 100%; height: auto; display: block; }
  .net rect { fill: var(--surface-2); stroke: var(--border); }
  .net .zone { fill: none; stroke: var(--border); stroke-dasharray: 4 4; }
  .net text { fill: var(--ink-soft); font: 600 9px Inter, sans-serif; }
  .net text.z { fill: var(--muted); font: 800 7.5px Inter, sans-serif; letter-spacing: 1px; }
  .net text.ip { fill: var(--muted); font: 500 8px 'Roboto Mono', monospace; }
  .net line { stroke: var(--muted); stroke-width: 1.2; }
  .net .dev { fill: color-mix(in oklab, var(--accent) 14%, var(--surface)); stroke: color-mix(in oklab, var(--accent) 40%, var(--border)); }
  .step .sk { font: 800 9.5px/1 Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .step h3 { font: 600 15.5px/1.35 Inter, sans-serif; color: var(--ink); margin: 8px 0 12px; letter-spacing: -0.005em; }
  .pick { display: grid; gap: 8px; }
  .pick button { min-height: 44px; border: 1px solid var(--border); border-radius: 11px; background: var(--bg); padding: 0 12px; font: 600 12px/1.2 'Roboto Mono', monospace; color: var(--ink-soft); cursor: pointer; display: flex; width: 100%; align-items: center; gap: 7px; text-align: left; transition: background-color .16s, border-color .16s, transform .12s var(--ease); }
  .pick button:active { transform: scale(0.98); }
  .pick button .ck { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--border); display: grid; place-items: center; flex: 0 0 auto; }
  .pick button.on { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--surface)); color: var(--ink); }
  .pick button.on .ck { background: var(--accent); border-color: var(--accent); }
  .pick button.on .ck svg { width: 11px; height: 11px; stroke: var(--on-accent); stroke-width: 3; }
  .fld { margin-top: 12px; }
  .fld label { display: block; font: 700 11.5px/1 Inter, sans-serif; color: var(--ink-soft); margin-bottom: 7px; }
  .sel { width: 100%; min-height: 46px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font: 500 13.5px/1.3 Inter, sans-serif; color: var(--muted); }
  .sel.set { color: var(--ink); border-color: color-mix(in oklab, var(--accent) 40%, var(--border)); }
  .sel svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .ord { display: flex; flex-direction: column; gap: 8px; }
  .ord .row { min-height: 48px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); padding: 10px 12px; font: 500 13px/1.35 Inter, sans-serif; color: var(--ink); }
  .ord .n { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font: 800 11px/1 Inter, sans-serif; color: var(--accent-deep); background: color-mix(in oklab, var(--accent) 11%, var(--surface)); }
  .ord .grip { margin-left: auto; flex: 0 0 auto; width: 18px; height: 18px; color: var(--muted); }

  /* ── dock ── */
  .dock { flex: 0 0 auto; display: flex; gap: 10px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid color-mix(in oklab, var(--border) 70%, transparent); background: var(--bg); }
  .btn-primary { flex: 1 1 auto; border: none; border-radius: 13px; padding: 14px; cursor: pointer; background: var(--accent); color: var(--on-accent); font: 700 15px/1 Inter, sans-serif; box-shadow: 0 10px 22px -12px color-mix(in oklab, var(--accent) 70%, transparent); transition: transform .15s var(--ease), filter .2s; }
  .btn-primary:active { transform: scale(0.985); }
  .btn-ghost { flex: 0 0 auto; border: 1px solid var(--border); border-radius: 13px; padding: 13px 16px; cursor: pointer; background: transparent; color: var(--ink-soft); font: 650 14px/1 Inter, sans-serif; display: inline-flex; align-items: center; gap: 7px; transition: transform .15s var(--ease); }
  .btn-ghost:active { transform: scale(0.98); }
  .btn-ghost svg { width: 14px; height: 14px; stroke-width: 2.2; }
  @media (hover:hover) and (pointer:fine) { .btn-primary:hover { filter: brightness(1.05); } }

  /* ── loader (the quiz's generating treatment) ── */
  .skel { border-radius: 12px; background: var(--surface-2); }
  .gen-line { font: 600 16px/1.4 Fraunces, Georgia, serif; letter-spacing: -0.008em; color: var(--ink); text-align: center; margin: 22px 14px 6px; }
  .gen-cap { display: block; text-align: center; font: 600 11.5px/1 Inter, sans-serif; color: var(--muted); }
  .gen-track { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; position: relative; margin: 14px 40px 0; }
  .gen-bar { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 999px; background: var(--accent); transform: translateX(-100%); }
  @media (prefers-reduced-motion: no-preference) {
    .shimmer { position: relative; overflow: hidden; }
    .shimmer::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--ink) 9%, transparent), transparent); animation: shim 1.35s var(--ease) infinite; }
    .gen-bar { animation: ind 1.5s var(--ease) infinite; }
    @keyframes shim { to { transform: translateX(100%); } }
    @keyframes ind { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  }

  /* ── verdict (the exam results' language) ── */

        var open = v === 'verdict-open';
        var RW = [
          { st: 'The answer: 3389', ok: true, det: '<div class="lab y ok">Your first pick</div><div class="val">A. 3389</div><p class="dwhy">' + Q.why + '</p>' },
          { st: '22', ok: true, det: '<div class="lab t">True reason</div><div class="val rs">' + KIT.B.r[0] + '</div><p class="dwhy">' + KIT.B.n + '</p>' },
          { st: '445', ok: true, det: '<div class="lab t">True reason</div><div class="val rs">' + KIT.C.r[0] + '</div><p class="dwhy">' + KIT.C.n + '</p>' },
          { st: '5900', ok: false, det: '<div class="lab y">Your reason</div><div class="val rs">' + KIT.D.r[1] + '</div><div class="lab t">True reason</div><div class="val rs">' + KIT.D.r[0] + '</div><p class="dwhy">' + KIT.D.n + '</p>' }
        ];
        h = '<div class="wbar"><button class="back" type="button" id="wBack" aria-label="Leave Why-Not">' + ic('back') + '</button>' + strip(1) + '</div>'
          + '<div class="body"><h2 class="vd-score reveal" style="margin-top:8px">You earned <em>3 of 4</em></h2><p class="miss-call reveal">You knew the answer. You misdiagnosed why <b>5900</b> loses.</p>'
          + '<div class="sect reveal">Your four points</div>'
          + RW.map(function (r, i) {
            return '<button class="srow reveal" type="button" aria-expanded="' + (open && i === 3) + '"><span class="sn2"><span class="st">' + r.st + '</span>' + (i ? '<span class="ss t">Option ' + 'ABCD'[i] + '</span>' : '<span class="ss t">Picked first time</span>') + '</span><span class="sv ' + (r.ok ? 'ok' : 'no') + '">' + (r.ok ? 'Right' : 'Wrong') + '</span>' + ic('right') + '</button><div class="sdet">' + r.det + '</div>';
          }).join('') + '</div>'
          + '<div class="dock stack"><button class="btn-primary" type="button">Next round</button><button class="btn-ghost" type="button" id="leaveBtn">Leave session</button></div>';
        hint = open ? 'A row opens to the reason you picked, the true reason and the note.' : 'You earned N of 4 and today’s callout, then the answer and the three wrong options. Tap a row.';
      } else if (v === 'session') {
        var R = [3, 4, 3], P = 10;
        h = '<div class="body"><div class="done-kick reveal" style="margin-top:12px">' + ic('wn') + 'Why-Not · ' + TOPIC + '</div>'
          + '<h2 class="vd-score reveal">Session: <em>' + P + ' of 12</em></h2>'
          + '<div class="vmeter s12 reveal">' + Array.apply(null, Array(12)).map(function (_, i) { return '<i class="' + (i < P ? 'on' : '') + '"></i>'; }).join('') + '</div>'
          + '<p class="done-sub reveal">3 questions answered toward today’s goal.</p>'
          + '<div class="sect reveal">Your three rounds</div>'
          + R.map(function (p, i) { return '<div class="srow reveal" style="cursor:default"><span class="sn2"><span class="st">Round ' + (i + 1) + '</span></span><span class="sv ' + (p === 4 ? 'ok' : 'nt') + '">' + p + ' of 4</span></div>'; }).join('') + '</div>'
          + '<div class="dock stack"><button class="btn-primary" type="button">Next target</button><button class="btn-ghost" type="button">Back to Drills</button></div>';
        hint = 'Session verdict: twelve points, one row per round. Back to Drills leaves without asking; the session is saved.';
      }
      $('app').innerHTML = h; $('hint').textContent = hint;
      function openS() { $('scrim').classList.add('open'); $('tsheet').classList.add('open'); }
      function closeS() { $('scrim').classList.remove('open'); $('tsheet').classList.remove('open'); }
      if ($('tgSwitch')) $('tgSwitch').addEventListener('click', openS);
      if ($('scrim')) $('scrim').addEventListener('click', closeS);
      if ($('tlist')) $('tlist').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        [].slice.call($('tlist').children).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        document.querySelector('.target .v').textContent = b.textContent; document.querySelector('.tg-why').textContent = 'Your pick';
        setTimeout(closeS, 140);
      });
      function openL() { $('lscrim').classList.add('open'); $('lsheet').classList.add('open'); }
      function closeL() { $('lscrim').classList.remove('open'); $('lsheet').classList.remove('open'); }
      if (!$('lsheet') && ($('leaveBtn') || $('wBack'))) $('app').insertAdjacentHTML('beforeend', SHEET_LEAVE);
      ['leaveBtn', 'wBack'].forEach(function (id) { if ($(id)) $(id).addEventListener('click', openL); });
      if ($('lscrim')) $('lscrim').addEventListener('click', closeL);
      if ($('lsStay')) $('lsStay').addEventListener('click', closeL);
      [].slice.call(document.querySelectorAll('button.srow')).forEach(function (b) { b.addEventListener('click', function () { b.setAttribute('aria-expanded', String(b.getAttribute('aria-expanded') !== 'true')); }); });
      if (v === 'entry-pick') setTimeout(openS, 40);
      if (v === 'leave') setTimeout(openL, 40);
      // theme
      var html = document.documentElement, label = $('themeLabel'), icon = $('themeIcon');
      var SUN = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
      var MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>';
      try { var saved = localStorage.getItem('ca-theme'); if (saved) html.setAttribute('data-theme', saved); } catch (e) {}
      function paint() { var dark = html.getAttribute('data-theme') !== 'light'; icon.innerHTML = dark ? SUN : MOON; label.textContent = dark ? 'Light' : 'Dark'; }
      $('themeToggle').addEventListener('click', function () { var n = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; html.setAttribute('data-theme', n); try { localStorage.setItem('ca-theme', n); } catch (e) {} paint(); });
      paint();
    })();
  </script>
</body>
</html>
